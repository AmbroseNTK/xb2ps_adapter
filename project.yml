name: Xb2PS
options:
  bundleIdPrefix: dev.xb2ps
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Xb2PS:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Xb2PS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        GCSupportsControllerUserInteraction: true
        NSBluetoothAlwaysUsageDescription: Xb2PS reads input from Xbox controllers connected over Bluetooth.
    entitlements:
      path: Xb2PS.entitlements
      properties:
        com.apple.developer.hid.virtual.device: true
